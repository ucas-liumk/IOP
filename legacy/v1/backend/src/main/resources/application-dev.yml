spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/gallant?stringtype=unspecified
    username: gallant
    password: gallant_dev
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

minio:
  endpoint: http://localhost:9000
  access-key: gallant
  secret-key: gallant_dev_minio
  bucket: gallant-files

# 用户身份: 因不区分角色, 用 header X-User-Id 携带用户 id; 缺省走 mock 用户 (id=1)
collab:
  mock-user-id: 1
  notification:
    poll-interval-seconds: 20
