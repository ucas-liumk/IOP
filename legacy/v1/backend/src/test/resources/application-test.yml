    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  type-aliases-package: com.gallant.collab.domain
  mapper-locations: classpath*:/mapper/**/*.xml

minio:
  endpoint: http://localhost:9000
  access-key: test
  secret-key: testtesttest
  bucket: gallant-files-test

collab:
  mock-user-id: 1

logging:
  level:
    com.gallant.collab: INFO
