spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/gallant?stringtype=unspecified
    username: gallant
    password: gallant_dev
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
