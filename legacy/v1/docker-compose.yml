# 本地开发依赖。生产时 db 换成 kingbasev8 (PG 兼容模式)，
# 应用侧只需更换 JDBC 驱动和 url。
services:
  db:
    image: postgres:16-alpine
    container_name: gallant-db
    environment:
      POSTGRES_DB: gallant
      POSTGRES_USER: gallant
      POSTGRES_PASSWORD: gallant_dev
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallant -d gallant"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: gallant-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gallant
      MINIO_ROOT_PASSWORD: gallant_dev_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 gallant gallant_dev_minio;
      mc mb --ignore-existing local/gallant-files;
      mc anonymous set download local/gallant-files;
      exit 0;
      "

volumes:
  db_data:
  minio_data:
