name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iop
          POSTGRES_PASSWORD: iop_dev
          POSTGRES_DB: iop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iop -d iop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: server/go.sum
      - name: Go vet
        working-directory: ./server
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ./server
          args: --timeout=5m
      - name: Unit + integration tests
        working-directory: ./server
        env:
          IOP_TEST_DB_DSN: "postgres://iop:iop_dev@localhost:5432/iop?sslmode=disable"
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build all binaries
        working-directory: ./server
        run: make build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: ./web
        run: npm ci
      - name: Type check + build
        working-directory: ./web
        run: npm run build
      - name: Unit tests (if any)
        working-directory: ./web
        run: npm test --if-present

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli lint server/api/openapi.yaml
